<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<style>
		.tile { fill: #111415 }
		.removed { fill: #f27f74 }
		.added { fill: #56c878 }
		@media (prefers-color-scheme: dark) {
			.tile { fill: #eceeef }
			.removed { fill: #b0271f }
			.added { fill: #136c39 }
		}
	</style>
	<rect class="tile" width="32" height="32" rx="7" />
	<rect class="removed" x="7" y="10" width="12" height="4" rx="2" />
	<rect class="added" x="7" y="18" width="18" height="4" rx="2" />
</svg>
